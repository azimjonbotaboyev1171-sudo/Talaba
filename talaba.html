<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuksalish App</title>
    <link rel="stylesheet" href="talaba.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="logo">EduTrack</div>
        <div class="lang-box">
            <button onclick="setLang('uz')">UZ</button>
            <button onclick="setLang('ru')">RU</button>
            <button onclick="setLang('en')">EN</button>
        </div>
    </header>

    <div id="main-content">
        <div id="screen-quiz" class="active">
            <h2 id="t-quiz-h">Yuksak marralar kutmoqda!</h2>
            <p id="t-quiz-p">Siz bu yo'lni oxirigacha bosib o'tishga tayyormisiz?</p>
            <button onclick="goAuth()" class="btn-main" id="t-quiz-b">Ha, tayyorman! 🚀</button>
        </div>

        <div id="screen-auth" style="display:none;">
            <h2 id="t-auth-h">Ro'yxatdan o'tish</h2>
            <input type="text" id="inp-name" placeholder="Ismingiz">
            <input type="tel" id="inp-phone" placeholder="+998XXXXXXXXX">
            <select id="inp-status">
                <option value="student">Talaba</option>
                <option value="school">Maktab o'quvchisi</option>
                <option value="other">Boshqa</option>
            </select>
            <button onclick="register()" class="btn-main" id="t-auth-b">Platformaga kirish</button>
        </div>
        <div id="screen-menu" class="screen" style="display:none;">
             <div class="grid">
                <div class="item" onclick="openModule('english')">
            <span>🇬🇧</span>
            <p>IELTS / English</p>
        </div>
        <div class="item" onclick="openModule('business')">
            <span>📈</span>
            <p>Biznes Olami</p>
        </div>
        <div class="item" onclick="openModule('crypto')">
            <span>💰</span>
            <p>Kripto bozor</p>
        </div>
        <div class="item" onclick="openModule('jobs')">
            <span>💼</span>
            <p>Vakansiyalar</p>
        </div>
        <div class="item" onclick="openModule('news')">
            <span>🌍</span>
            <p>Yangiliklar</p>
        </div>
        <div class="item" onclick="openModule('cabinet')">
            <span>👤</span>
            <p>Kabinet</p>
        </div>
    </div>
</div>

    <div id="module-content" class="screen" style="display:none;">
    <button onclick="showMainDashboard()" class="btn-back">⬅️ Orqaga</button>
    <div id="module-body">
        </div>
     </div>
</div>
    <script src="talaba.js"></script>
</body>
</html>
